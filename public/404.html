<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — JGS Proficiência</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/404.css">
</head>
<body>
  <main class="error-page">
    <div class="error-grid" aria-hidden="true"></div>
    <header class="error-header">
      <a href="/" aria-label="Ir para a página inicial">
        <img src="/logobranca.png" alt="JGS Proficiência">
      </a>
      <span class="status-code">ERRO 404</span>
    </header>

    <section class="error-content" aria-labelledby="error-title">
      <div class="error-number" aria-hidden="true">404</div>
      <div class="error-copy">
        <p class="eyebrow">Leitura fora da escala</p>
        <h1 id="error-title">Esta página não foi encontrada.</h1>
        <p class="description">O endereço pode estar incorreto ou a página pode ter mudado de lugar. Vamos levar você de volta ao caminho certo.</p>
        <div class="error-actions">
          <a class="button button-primary" href="/">Voltar para o início <span aria-hidden="true">→</span></a>
          <a class="button button-secondary" href="/login">Área do cliente</a>
        </div>
      </div>
    </section>

    <footer class="error-footer">
      <span>JGS PROFICIÊNCIA</span>
      <span>Ensaios e comparações interlaboratoriais</span>
    </footer>
  </main>
</body>
</html>
